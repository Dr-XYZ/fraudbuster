name: Scheduled Batch Fraud Tracking Crawler

on:
  schedule:
    - cron: '23 */2 * * *' # 避開整點尖峰塞車，每 2 小時的 23 分執行
  workflow_dispatch:
    inputs:
      batch_size:
        description: '每次爬取的案件筆數 (Batch Size)'
        required: false
        default: '500'
      concurrency:
        description: '並發執行緒數 (Concurrency)'
        required: false
        default: '10'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  batch-crawl-and-deploy:
    runs-on: ubuntu-latest
    name: High-Throughput Crawler & Auto Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Batch Crawler
        run: |
          BATCH_SIZE="${{ github.event.inputs.batch_size || '500' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '10' }}"
          echo "🚀 Starting crawler with Batch Size: $BATCH_SIZE, Concurrency: $CONCURRENCY"
          python3 scripts/batch_crawler.py --batch-size "$BATCH_SIZE" --concurrency "$CONCURRENCY"

      - name: Generate Dashboard HTML
        run: |
          python3 generate_dashboard.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit & Push Updated Tracking Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add tracking_db.json index.html
          git diff --staged --quiet || (git commit -m "chore(crawler): update tracking database & dashboard [skip ci]" && git push)
