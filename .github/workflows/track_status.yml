name: Auto Anti-Fraud Tracker

on:
  schedule:
    # - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間 08:00) 自動跑
  workflow_dispatch:     # 支援在 GitHub 介面上手動點擊執行

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check script
        run: python check_status.py

      - name: Commit and push updated status.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git status
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update anti-fraud status" && git push)
