name = "fraudbuster"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# 每 2 小時排程執行追蹤與狀態更新
[triggers]
crons = ["0 */2 * * *"]

# Cloudflare D1 資料庫繫結 (綁定名稱: DB)
# 請將 database_id 替換為您的 Cloudflare D1 Database ID
[[d1_databases]]
binding = "DB"
database_name = "fraudbuster-db"
database_id = "84aed76d-2bca-46af-a8ef-207d124112ee"
